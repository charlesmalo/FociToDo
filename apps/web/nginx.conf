# Re-resolve `api` through Docker's embedded DNS (127.0.0.11) instead of
# resolving it once at nginx startup: when the api container restarts it gets
# a new IP on the Compose network, and without this nginx would keep
# proxying to the stale address until web itself was restarted.
resolver 127.0.0.11 valid=10s ipv6=off;

# Pooled, persistent connections to the API: without this nginx opens a brand
# new TCP connection per proxied request (default Connection: close upstream),
# and under sustained load the container exhausts ephemeral ports. Keep
# keepalive_timeout below Node's default server.keepAliveTimeout (5s) so nginx
# never tries to reuse a socket the instant before Node closes it from its end.
# `zone` + the `resolve` parameter (nginx >= 1.27.3 open source) make this a
# re-resolvable upstream while keeping the keepalive pool intact.
upstream api_upstream {
  zone api_upstream 64k;
  server api:3000 resolve;
  keepalive 64;
  keepalive_timeout 4s;
}

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  client_max_body_size 64k;

  # Same origin for the SPA and the API: no CORS. Path, If-Match, ETag and
  # Idempotency-Key headers pass through unchanged.
  location /api/ {
    proxy_pass http://api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # SPA fallback: any non-file path serves index.html.
  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache";
  }
}
