name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, typecheck and tests (100% coverage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run the test profile
        run: docker compose --profile test run --rm --build test
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: reports/coverage
          if-no-files-found: ignore
      - name: Tear down
        if: always()
        run: docker compose --profile test down -v

  e2e:
    name: End-to-end (Playwright)
    needs: test
    runs-on: ubuntu-latest
    env:
      GIT_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Run end-to-end tests
        run: docker compose -p foci-e2e -f compose.yaml -f compose.e2e.yaml run --rm --build e2e
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            reports/e2e
            reports/e2e-results
          if-no-files-found: ignore
      - name: Tear down
        if: always()
        run: docker compose -p foci-e2e -f compose.yaml -f compose.e2e.yaml down -v

  images:
    name: Build runtime images
    runs-on: ubuntu-latest
    env:
      GIT_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Build migrate, api and web targets
        run: docker compose build migrate api web
